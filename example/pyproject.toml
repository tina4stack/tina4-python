[project]
name = "tina4-store-demo"
version = "1.0.0"
description = "Tina4 Store — Complete framework demo app"
requires-python = ">=3.12"
license = {text = "MIT"}

dependencies = [
    "tina4-python>=3.11.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120
