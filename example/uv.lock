version = 1
revision = 3
requires-python = ">=3.12"

[[package]]
name = "tina4-python"
source = { editable = "../" }

[package.metadata]
requires-dist = [
    { name = "firebird-driver", marker = "extra == 'all-db'", specifier = ">=1.10" },
    { name = "firebird-driver", marker = "extra == 'firebird'", specifier = ">=1.10" },
    { name = "mysql-connector-python", marker = "extra == 'all-db'", specifier = ">=9.0" },
    { name = "mysql-connector-python", marker = "extra == 'mysql'", specifier = ">=9.0" },
    { name = "psycopg2-binary", marker = "extra == 'all-db'", specifier = ">=2.9" },
    { name = "psycopg2-binary", marker = "extra == 'postgres'", specifier = ">=2.9" },
    { name = "pymemcache", marker = "extra == 'memcache'", specifier = ">=4.0" },
    { name = "pymongo", marker = "extra == 'all-db'", specifier = ">=4.0" },
    { name = "pymongo", marker = "extra == 'mongo'", specifier = ">=4.0" },
    { name = "pymssql", marker = "extra == 'all-db'", specifier = ">=2.3" },
    { name = "pymssql", marker = "extra == 'mssql'", specifier = ">=2.3" },
    { name = "pyodbc", marker = "extra == 'all-db'", specifier = ">=5.0" },
    { name = "pyodbc", marker = "extra == 'odbc'", specifier = ">=5.0" },
    { name = "redis", marker = "extra == 'redis'", specifier = ">=5.0" },
]
provides-extras = ["all-db", "firebird", "memcache", "mongo", "mssql", "mysql", "odbc", "postgres", "redis"]

[package.metadata.requires-dev]
dev = [
    { name = "bottle", specifier = ">=0.13.4" },
    { name = "cython", specifier = ">=3.2.4" },
    { name = "django", specifier = ">=6.0.3" },
    { name = "fastapi", specifier = ">=0.135.1" },
    { name = "flask", specifier = ">=3.1.3" },
    { name = "pytest", specifier = ">=8.0" },
    { name = "pytest-asyncio", specifier = ">=0.23" },
    { name = "pytest-cov", specifier = ">=5.0" },
    { name = "reportlab", specifier = ">=4.4.10" },
    { name = "ruff", specifier = ">=0.4" },
    { name = "setuptools", specifier = ">=82.0.1" },
    { name = "uvicorn", specifier = ">=0.42.0" },
]

[[package]]
name = "tina4-store-demo"
version = "1.0.0"
source = { virtual = "." }
dependencies = [
    { name = "tina4-python" },
]

[package.metadata]
requires-dist = [{ name = "tina4-python", editable = "../" }]
