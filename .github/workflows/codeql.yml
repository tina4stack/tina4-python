name: CodeQL

# Static security analysis for the shipped Python framework (tina4_python/).
# Runs on every PR into v3, every push to v3, and weekly so advisories in queries
# that land after a commit still get caught.

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]
  schedule:
    # Mondays 03:27 UTC — off-peak, avoids the top-of-hour runner crush.
    - cron: '27 3 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze (python)
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Initialize CodeQL
        uses: github/codeql-action/init@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          languages: python
          # Interpreted language — no build needed.
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@4bfa242aa49c5f7c6770b98670d354a7dfac05f8 # v3
        with:
          category: "/language:python"
