name: Tests

on:
  push:
    branches: [v3]
  pull_request:
    branches: [v3]

jobs:
  test:
    runs-on: ubuntu-latest

    # Real-service test gate. Every backend the suite can touch runs for real in
    # CI so the integration tests execute instead of skipping (the gap that let
    # the migration / queue bugs ship). Service containers are health-checked, so
    # the job fails if one never comes up. Ports mirror the local docker harness
    # (/tmp/tina4_infra_up.sh) so the same canonical test-service variables
    # (tests/fixtures/test_env_contract.json) work locally and here.
    services:
      # GreenMail: real SMTP 3025 + IMAP 3143 for the Messenger round-trip
      # tests. auth.disabled is REQUIRED, not laziness: every suite uses a unique
      # random recipient per test so each mailbox is created on FIRST ACCESS,
      # which cannot work against a server demanding pre-registered users.
      greenmail:
        image: greenmail/standalone:2.1.3
        ports: ['3025:3025', '3143:3143']
        env:
          GREENMAIL_OPTS: '-Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0 -Dgreenmail.auth.disabled'
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      valkey:
        image: valkey/valkey:8-alpine
        ports: ['6380:6379']
        options: >-
          --health-cmd "valkey-cli ping" --health-interval 5s --health-timeout 3s --health-retries 10
      memcached:
        image: memcached:alpine
        ports: ['11211:11211']
      mongo:
        image: mongo:7
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok' || mongo --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 10
      postgres:
        image: postgres:16
        ports: ['55432:5432']
        env:
          POSTGRES_USER: tina4
          POSTGRES_PASSWORD: tina4
          POSTGRES_DB: tina4_py
        options: >-
          --health-cmd "pg_isready -U tina4 -d tina4_py" --health-interval 5s --health-timeout 3s --health-retries 20
      rabbitmq:
        image: rabbitmq:3-management
        ports: ['5672:5672', '15672:15672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping" --health-interval 10s --health-timeout 5s --health-retries 20
      # MySQL 8 + MSSQL 2022 (#262). The MSSQL image starts with no user
      # database, so a later step CREATEs tina4_test once it is healthy.
      mysql:
        image: mysql:8
        ports: ['3306:3306']
        env:
          MYSQL_DATABASE: tina4_test
          MYSQL_USER: tina4
          MYSQL_PASSWORD: tina4
          MYSQL_ROOT_PASSWORD: tina4
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptina4" --health-interval 5s --health-timeout 3s --health-retries 20
      mssql:
        image: mcr.microsoft.com/mssql/server:2022-latest
        ports: ['1433:1433']
        env:
          ACCEPT_EULA: 'Y'
          SA_PASSWORD: 'TinaSQL123!Secure'
          MSSQL_PID: Developer
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -C -Q 'SELECT 1' || /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q 'SELECT 1'" --health-interval 10s --health-timeout 5s --health-retries 20

    env:
      # Enable the real-service integration tests (they skip when unset).
      TINA4_TEST_PG_HOST: localhost
      TINA4_TEST_PG_PORT: '55432'
      TINA4_TEST_PG_USERNAME: tina4
      TINA4_TEST_PG_PASSWORD: tina4
      TINA4_TEST_PG_DB: tina4_py
      TINA4_TEST_PG_URL: postgres://tina4:tina4@localhost:55432/tina4_py
      TINA4_TEST_MONGO_URI: mongodb://localhost:27017
      TINA4_TEST_REDIS_URL: redis://localhost:6379
      TINA4_TEST_VALKEY_URL: redis://localhost:6380
      TINA4_TEST_RABBITMQ_URL: amqp://guest:guest@localhost:5672
      TINA4_TEST_KAFKA_URL: localhost:9092
      TINA4_KAFKA_BROKERS: localhost:9092
      # MQTT 3.1.1 brokers started by the "Start MQTT brokers" step below;
      # TINA4_TEST_MQTT_CA_FILE is injected there once the certs are generated.
      TINA4_TEST_MQTT_URL: mqtt://127.0.0.1:1883
      TINA4_TEST_MQTT_AUTH_URL: mqtt://127.0.0.1:1884
      TINA4_TEST_MQTT_TLS_URL: mqtts://127.0.0.1:8883
      TINA4_TEST_MQTT_EMQX_URL: mqtt://127.0.0.1:1885
      TINA4_TEST_MQTT_USERNAME: tina4
      TINA4_TEST_MQTT_PASSWORD: testpass
      # MySQL 8 + MSSQL 2022 (#262) — mirror the service containers above; the
      # MySQL/MSSQL live tests default to these host/port values.
      TINA4_TEST_MYSQL_HOST: localhost
      TINA4_TEST_MYSQL_PORT: '3306'
      TINA4_TEST_MYSQL_USERNAME: tina4
      TINA4_TEST_MYSQL_PASSWORD: tina4
      TINA4_TEST_MYSQL_DB: tina4_test
      TINA4_TEST_MSSQL_HOST: localhost
      TINA4_TEST_MSSQL_PORT: '1433'
      TINA4_TEST_MSSQL_USERNAME: sa
      TINA4_TEST_MSSQL_PASSWORD: 'TinaSQL123!Secure'
      TINA4_TEST_MSSQL_DB: tina4_test
      # Turn a missing provisioned service into a hard failure (no green skips).
      TINA4_REQUIRE_SERVICES: '1'

    steps:
      # The greenmail/standalone image is a bare JRE with no nc/curl, so a
      # container --health-cmd cannot run -- and a probe that cannot run looks
      # exactly like a broken service. Wait from the RUNNER instead and FAIL the
      # job if it never listens: the require-services gate now treats a
      # "greenmail not reachable" skip as fatal, so a silent no-show must be loud
      # here rather than surfacing as a confusing gate failure later.
      # shell: bash is mandatory -- /dev/tcp is a bash feature, absent in sh.
      - name: Wait for GreenMail (SMTP 3025 / IMAP 3143)
        shell: bash
        run: |
          for i in $(seq 1 60); do
            if (exec 3<>/dev/tcp/127.0.0.1/3025) 2>/dev/null \
               && (exec 4<>/dev/tcp/127.0.0.1/3143) 2>/dev/null; then
              echo "GreenMail ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "GreenMail did not become ready in 60s"; exit 1

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # Password-protected Redis for the credential tests (GHA services can't
      # pass --requirepass, so run it as a plain container on 6381).
      - name: Start auth Redis
        run: docker run -d --name tina4-cache-redis-auth -p 6381:6379 redis:7-alpine redis-server --requirepass s3cret

      # Kafka in KRaft mode (single node, no ZooKeeper). GitHub service
      # containers can't express the KRaft listener config cleanly, so run it as
      # a plain container and FAIL the job if the broker never serves metadata.
      - name: Start Kafka (KRaft)
        run: |
          docker run -d --name tina4-kafka -p 9092:9092 \
            -e KAFKA_NODE_ID=1 -e KAFKA_PROCESS_ROLES=broker,controller \
            -e KAFKA_LISTENERS=PLAINTEXT://:9092,CONTROLLER://:9093 \
            -e KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092 \
            -e KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER \
            -e KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT \
            -e KAFKA_CONTROLLER_QUORUM_VOTERS=1@localhost:9093 \
            -e KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1 \
            apache/kafka:3.7.0
          echo "Waiting for Kafka to serve metadata on :9092 ..."
          for i in $(seq 1 60); do
            if docker exec tina4-kafka /opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1; then
              echo "Kafka ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "Kafka did not become ready in 60s"; docker logs tina4-kafka | tail -40; exit 1

      # MQTT 3.1.1: Mosquitto (1883 anon / 1884 auth / 8883 TLS). The vendored
      # script generates certs + a password file, starts Mosquitto, and FAILS the
      # job if it does not come up - so the MQTT tests never skip green. EMQX (the
      # SUBACK-0x80 refusal path) is exercised only by the Ruby suite, so here it
      # is best-effort (MQTT_REQUIRE_EMQX=false: not started, never fatal).
      - name: Start MQTT brokers (Mosquitto 1883/1884/8883; EMQX best-effort)
        run: |
          MQTT_REQUIRE_EMQX=false bash tests/mqtt-infra.sh "$RUNNER_TEMP/tina4-mqtt-infra"
          echo "TINA4_TEST_MQTT_CA_FILE=$RUNNER_TEMP/tina4-mqtt-infra/certs/ca.crt" >> "$GITHUB_ENV"

      - name: Install dependencies
        # `--extra test` is the DECLARED client set (pyproject
        # [project.optional-dependencies].test). It replaces an ad-hoc
        # `uv pip install pymongo confluent-kafka pika ...` list that lived only
        # here, so no framework consumer could reproduce the test environment --
        # and confluent-kafka / pika were in no extra at all. Installing via the
        # extra means CI exercises the same declaration everyone else uses, so it
        # cannot drift from reality unnoticed.
        run: pip install uv && uv sync --extra test

      # The MSSQL image boots with no user database; create tina4_test once the
      # server is healthy (the live MSSQL tests connect to it).
      - name: Create MSSQL database (tina4_test)
        run: |
          for i in $(seq 1 30); do
            if docker exec "$(docker ps -qf ancestor=mcr.microsoft.com/mssql/server:2022-latest)" /opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P 'TinaSQL123!Secure' -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test" 2>/dev/null \
               || docker exec "$(docker ps -qf ancestor=mcr.microsoft.com/mssql/server:2022-latest)" /opt/mssql-tools/bin/sqlcmd -S localhost -U sa -P 'TinaSQL123!Secure' -Q "IF DB_ID('tina4_test') IS NULL CREATE DATABASE tina4_test" 2>/dev/null; then
              echo "tina4_test database ready"; exit 0
            fi
            sleep 2
          done
          echo "MSSQL never became ready to create tina4_test"; exit 1

      # Metrics is measured by the NATIVE engine in the tina4 Rust CLI (ADR-0002)
      # and has no in-framework fallback, so these files need that binary on PATH
      # and simply cannot run here. The engine is tested where it lives -
      # tina4stack/tina4 src/metrics.rs, exercised by `cargo test` in its own CI -
      # so excluding them loses no coverage; installing a second toolchain in four
      # framework pipelines to re-test one Rust binary would only duplicate it.
      # They still run locally for anyone with the CLI installed.
      - name: Run tests
        run: |
          uv run pytest tests/ -v \
            --ignore=tests/test_metrics_cli.py \
            --ignore=tests/test_metrics_collector.py \
            --ignore=tests/test_metrics_dispatch_pipeline.py \
            --ignore=tests/test_metrics_engine.py \
            --ignore=tests/test_metrics_nested_complexity.py \
            --ignore=tests/test_metrics_offender_cap.py

      # ADR-0024 rule 4: the ZERO-DEPENDENCY default counts double, because it
      # is the provider every developer starts on. `uv sync --extra test`
      # installs the `redis` package, so every redis/valkey cache test above
      # takes the DRIVER path and the raw RESP transport - the default install -
      # has no coverage at all in that run. That is not hypothetical: the
      # measured RedisBackend.clear() no-op and the stats() constant-0 both lived
      # ONLY on the raw path and both shipped green for exactly this reason.
      #
      # So run the cache suites again with the driver REMOVED. This is a real
      # zero-dependency environment, not a simulated one. TINA4_TEST_NO_REDIS_DRIVER
      # marks the removal as deliberate, so the driver-path variants report
      # not-applicable instead of tripping the no-silent-skip gate - an
      # UNEXPECTED missing driver still fails loudly, because that variable
      # cannot be set by accident.
      - name: Run cache suites on the ZERO-DEPENDENCY transport
        env:
          TINA4_TEST_NO_REDIS_DRIVER: "1"
        run: |
          uv pip uninstall redis
          python -c "
          import importlib.util, sys
          if importlib.util.find_spec('redis') is not None:
              sys.exit('redis driver still importable - this leg would prove nothing')
          print('confirmed: redis driver absent, raw RESP is the only transport')
          "
          uv run pytest -v \
            tests/test_cache_clear_invalidates.py \
            tests/test_cache_key_database_identity.py \
            tests/test_cache_provider_selection.py \
            tests/test_cache_null_round_trip.py \
            tests/test_cache_sweep_counts.py \
            tests/test_cache_clear_persistent_layer.py \
            tests/test_cache_memcached_exptime.py \
            tests/test_cache_backends.py \
            tests/test_cache.py \
            tests/test_db_query_cache.py \
            | tee /tmp/zerodep.txt
          # A LEG THAT FALLS BACK MUST NOT REPORT SUCCESS. Adapted from the PHP
          # driver leg, which asserts on the assertion-count DIFFERENTIAL: if the
          # driver leg ever reports the raw leg's number, it silently fell back.
          #
          # The zero-dep failure mode is the mirror image and just as quiet: if
          # redis were UNREACHABLE, every redis test would skip, nothing would
          # fail, and this leg would report success having exercised nothing at
          # all. So require BOTH a real floor of passing tests AND exactly the
          # driver-variant skips - no more, no less.
          python - <<'PY'
          import re, sys
          out = open("/tmp/zerodep.txt").read()
          m = re.search(r"(\d+) passed(?:, (\d+) skipped)?", out)
          if not m:
              sys.exit("no pytest summary found - the leg proved nothing")
          passed, skipped = int(m.group(1)), int(m.group(2) or 0)
          # The 4 driver-parametrised cases in test_cache_clear_invalidates.py are
          # the ONLY things allowed to skip here.
          if skipped != 4:
              sys.exit(f"expected exactly 4 driver-variant skips, got {skipped}. "
                       "More means real tests skipped silently (an unreachable "
                       "service); fewer means the driver is still present.")
          if passed < 140:
              sys.exit(f"only {passed} tests passed on the zero-dependency path; "
                       "expected 140+. The leg ran but exercised almost nothing.")
          print(f"zero-dependency leg exercised {passed} passing tests, {skipped} driver-variant skips")
          PY

      - name: Report results
        if: always()
        run: echo "Test run completed with exit code $?"

  # Firebird 5.0.2 in its own job. The main `test` job above deliberately does
  # NOT provision Firebird (TINA4_REQUIRE_SERVICES excludes it), which is right
  # for that already-heavy multi-service runner. The consequence was that Python
  # was the ONLY framework with no Firebird CI at all - PHP, Ruby and Node each
  # already run one - so the live Firebird tests only ever ran by hand. Two real
  # bugs (identifier folding, primary_key hardcoded false) reached production
  # through exactly that gap. This job stands up a REAL Firebird, installs
  # firebird-driver against libfbclient, and RUNS the live tests. NO-SILENT-SKIP
  # guards fail the job if the tests report pending/skipped instead of passing -
  # an unset URL, an unreachable server or a missing driver would otherwise leave
  # them green. This is the Python twin of Ruby's `fb`-gem guard and PHP's
  # `php -m | grep interbase` teeth.
  firebird:
    runs-on: ubuntu-latest
    env:
      # Classic double-slash absolute-path form (the adapter's documented shape).
      TINA4_TEST_FIREBIRD_URL: firebird://SYSDBA:masterkey@localhost:3050//var/lib/firebird/data/test.fdb
      TINA4_TEST_FIREBIRD_USERNAME: SYSDBA
      TINA4_TEST_FIREBIRD_PASSWORD: masterkey
    steps:
      - uses: actions/checkout@v4

      # A plain container, not a `services:` block - GitHub's health-check cannot
      # wait for Firebird's first-boot database creation cleanly. FAIL the job if
      # it never accepts a query, so the coverage has teeth.
      - name: Start Firebird 5.0.2
        run: |
          docker run -d --name tina4-firebird -p 3050:3050 \
            -e FIREBIRD_ROOT_PASSWORD=masterkey \
            -e FIREBIRD_DATABASE=test.fdb \
            firebirdsql/firebird:5.0.2
          echo "Waiting for Firebird to accept connections on :3050 ..."
          for i in $(seq 1 30); do
            if docker exec tina4-firebird /opt/firebird/bin/isql -user SYSDBA -password masterkey \
                 /var/lib/firebird/data/test.fdb -q -o /dev/null <<<'SELECT 1 FROM RDB$DATABASE;' 2>/dev/null; then
              echo "Firebird ready after ${i} attempt(s)"; exit 0
            fi
            sleep 2
          done
          echo "Firebird did not become ready in time"; docker logs tina4-firebird | tail -40; exit 1

      # libfbclient: firebird-driver loads libfbclient.so.2 through ctypes at
      # runtime, so the client library must be present or every connect fails.
      - name: Install Firebird client library (libfbclient)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends firebird-dev

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies (incl. firebird-driver)
        run: pip install uv && uv sync && uv pip install firebird-driver

      # PROVE the driver imports AND finds libfbclient. An ImportError or a
      # missing client library here FAILS the job - it must never degrade the
      # live tests to a green skip.
      - name: Verify firebird-driver loads (no-silent-skip guard)
        run: |
          uv run python -c "import firebird.driver as d; print('firebird-driver', d.__name__, 'imported OK')"

      # The identifier-folding + primary-key regression file: pure-logic cases
      # plus live ones. Assert cases actually RAN and none skipped, so a broken
      # URL or driver cannot hide behind pytest's green skip. pytest's own
      # non-zero exit (with pipefail) covers failures; what a plain exit code
      # CANNOT distinguish is "all passed" from "all skipped" or "collected 0".
      #
      # Pin the INVARIANT (>= 1 passed, 0 skipped), NOT a literal total: a guard
      # written as `grep "10 passed"` goes red the day someone adds an 11th case,
      # which is exactly how the Node Firebird guard broke on a fully passing run.
      - name: Run Firebird identifier + primary-key tests (no-silent-skip guard)
        run: |
          set -o pipefail
          out=$(uv run pytest tests/test_firebird_identifier_and_pk.py -v 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -qE "[1-9][0-9]* passed" || {
            echo "::error::test_firebird_identifier_and_pk reported no passing tests - its live cases did not run."; exit 1; }
          if printf '%s\n' "$out" | grep -qE "[1-9][0-9]* skipped"; then
            echo "::error::test_firebird_identifier_and_pk had skipped tests - the live-Firebird coverage did not run."; exit 1
          fi
          echo "test_firebird_identifier_and_pk RAN its cases against live Firebird (0 skipped)."

      # The driver-level live class in the shared driver suite. Its gate imports
      # firebird-driver first (the adapter's own preference order), so with the
      # driver installed and the server up it must RUN, not skip.
      - name: Run live Firebird driver tests (no-silent-skip guard)
        run: |
          set -o pipefail
          out=$(uv run pytest "tests/test_database_drivers.py::TestFirebirdLive" -v 2>&1 | tee /dev/stderr)
          printf '%s\n' "$out" | grep -qE "[1-9][0-9]* passed" || {
            echo "::error::TestFirebirdLive reported no passing tests - it skipped instead of running."; exit 1; }
          if printf '%s\n' "$out" | grep -qE "[1-9][0-9]* skipped"; then
            echo "::error::TestFirebirdLive skipped - the live driver path did not run."; exit 1
          fi
          echo "TestFirebirdLive RAN against live Firebird (0 skipped)."

      - name: Stop Firebird
        if: always()
        run: docker rm -f tina4-firebird || true
