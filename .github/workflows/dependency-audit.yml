# Known-vulnerability audit of every package pinned in uv.lock (all extras).
#
# tina4-python has no runtime dependencies, but its optional extras do, and
# uv.lock pins them. The Snyk GitHub integration cannot read this project: it
# reports "Failed to detect issues" on pyproject.toml (a PEP 621 manifest with
# a uv lock, not Poetry/pip), so it never scanned a single dependency here. This
# job does: it exports the exact locked versions and checks each one against
# the PyPI/OSV advisory database with pip-audit. Its first run caught
# dnspython 2.9.1 (GHSA-vvf4-9x63-8xvv).
#
# It runs when the dependency surface changes and weekly, because a new
# advisory against an unchanged lock is still a finding.
name: Dependency audit

on:
  pull_request:
    branches: [v3]
    paths: [pyproject.toml, uv.lock, .github/workflows/dependency-audit.yml]
  push:
    branches: [v3]
    paths: [pyproject.toml, uv.lock, .github/workflows/dependency-audit.yml]
  schedule:
    - cron: "17 5 * * 1"
  workflow_dispatch:

# Least-privilege GITHUB_TOKEN: the audit only reads the repo (CWE-275).
permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up uv
        # SHA-pin third-party actions (ADR-0073 / CodeQL actions/unpinned-tag).
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3.2.4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Export the locked dependency set
        # --frozen: audit exactly what uv.lock pins, never a fresh resolve.
        # --no-emit-project: tina4-python itself is not a third-party package.
        run: |
          uv export --frozen --all-extras --no-hashes --no-emit-project \
            --format requirements-txt -o locked-requirements.txt
          echo "auditing $(grep -cE '^[a-zA-Z]' locked-requirements.txt) locked packages"

      - name: Audit for known vulnerabilities
        # The versions are already pinned, so pip-audit checks them as listed
        # (--no-deps --disable-pip) instead of resolving anything itself.
        run: uvx pip-audit@2.9.0 -r locked-requirements.txt --no-deps --disable-pip --progress-spinner off
