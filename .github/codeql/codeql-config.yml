name: "tina4-python CodeQL config"

# Scan the shipped framework (tina4_python/) and scaffolding. Everything excluded
# below is non-shipped, so scanning it is only noise:
#   - tests/       the pytest suite, not part of the published package
#   - benchmarks/  competitor-comparison scripts
#   - example/     sample app
paths-ignore:
  - tests
  - benchmarks
  - example
